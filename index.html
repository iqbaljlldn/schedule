<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Public Speaking Daily Schedule Tracker - Hari Ini Siapa yang Maju?</title>
  <meta name="description" content="Aplikasi pelacak jadwal harian sesi public speaking kelas. Menjawab langsung siapa yang maju hari ini, mendukung tukar giliran, tunda sakit/izin, dan reorder antrean secara otomatis." />
  <meta name="keywords" content="public speaking, schedule tracker, jadwal kelas, pelacak jadwal harian, education" />
  <meta name="author" content="Classroom Scheduler" />

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <!-- Global App Header -->
  <header class="app-header">
    <div class="app-container">
      <div class="header-inner">
        <div class="brand-section">
          <span class="brand-icon" aria-hidden="true">🎙️</span>
          <div>
            <h1 class="brand-title">Public Speaking Tracker</h1>
          </div>
          <span class="header-class-badge" id="header-class-name">Backend Engineering</span>
        </div>

        <div class="header-actions">
          <button
            class="btn-icon-subtle"
            id="theme-toggle-btn"
            type="button"
            title="Beralih Mode Gelap/Terang (Pintasan: D)"
            aria-label="Ubah tema tampilan"
          >
            <span id="theme-toggle-icon" aria-hidden="true">🌙</span>
          </button>
          <button
            class="btn-icon-subtle"
            id="btn-help-shortcuts"
            type="button"
            title="Bantuan Pintasan Keyboard (Pintasan: ?)"
            aria-label="Pintasan keyboard"
          >
            <span aria-hidden="true">⌨️</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="app-container">
    <!-- Top Navigation Tabs -->
    <nav class="app-nav" aria-label="Menu Utama">
      <div class="nav-tabs-list" role="tablist">
        <button
          class="nav-tab-btn active"
          data-tab="dashboard"
          role="tab"
          aria-selected="true"
          id="tab-today"
        >
          <span>🎙️ Hari Ini</span>
          <span class="nav-pill-badge badge-pill-active" id="nav-today-badge">Memuat...</span>
        </button>
        <button
          class="nav-tab-btn"
          data-tab="schedule"
          role="tab"
          aria-selected="false"
          id="tab-schedule"
        >
          <span>📅 Jadwal Lengkap</span>
        </button>
        <button
          class="nav-tab-btn"
          data-tab="students"
          role="tab"
          aria-selected="false"
          id="tab-students"
        >
          <span>👥 Anggota Kelas</span>
        </button>
        <button
          class="nav-tab-btn"
          data-tab="settings"
          role="tab"
          aria-selected="false"
          id="tab-settings"
        >
          <span>⚙️ Pengaturan</span>
        </button>
      </div>
    </nav>

    <!-- Main View Dynamic Slot -->
    <main id="main-content" tabindex="-1">
      <!-- Injected by JavaScript router -->
    </main>
  </div>

  <!-- Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Application Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
